<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Race Engineer</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

<header class="header">

  <div class="brand">

    <div class="mark">
      RE
    </div>

    <div class="brandText">
      <h1>Race Engineer</h1>
      <span>Live Race Analytics</span>
    </div>

  </div>


  <div class="headerRace">

    <div class="fieldLabel">
      RACE / SESSION
    </div>

    <div
      id="raceDropdown"
      class="dropdown raceDropdown"
      data-value="live"
      data-label="Current race"
    >

      <div
        id="raceDropdownTrigger"
        class="dropdownTrigger raceDropdownTrigger"
        tabindex="0"
      >

        <span
          id="raceDropdownStatusDot"
          class="dropdownStatusDot live"
        ></span>

        <input
          id="raceDropdownSearch"
          class="dropdownSearchInput"
          type="text"
          value="Current race"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search race or session"
        >

        <span
          id="raceDropdownLabel"
          class="dropdownStoredLabel"
        >
          Current race
        </span>

        <span class="dropdownCaret">
          ▾
        </span>

      </div>


      <div
        id="raceDropdownMenu"
        class="dropdownMenu"
      >

        <div class="dropdownGroupLabel">
          LIVE
        </div>

        <button
          type="button"
          class="dropdownOption selected"
          data-value="live"
        >
          <span class="dropdownStatusDot live"></span>
          <span>Current race</span>
          <span class="dropdownCheck">✓</span>
        </button>

      </div>

    </div>


    <span
      id="raceModeBadge"
      class="raceModeBadge live"
    >
      LIVE
    </span>

  </div>


  <div class="headerMetrics">

    <div class="headerMetric">
      <span class="headerMetricLabel">
        SESSION
      </span>

      <strong id="sessionName">
        Apex Timing
      </strong>
    </div>


    <div class="headerMetric">
      <span class="headerMetricLabel">
        STATUS
      </span>

      <strong id="sessionStatus">
        —
      </strong>
    </div>


    <div class="headerMetric">
      <span class="headerMetricLabel">
        TEAMS
      </span>

      <strong id="headerTeamCount">
        0
      </strong>
    </div>

  </div>


  <div class="statusbar">
